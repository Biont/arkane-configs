# Dedicated dnsmasq for Docker bridges.
#
# NetworkManager's dnsmasq plugin runs with --bind-dynamic and only attaches to
# NM-managed interfaces, so it never appears on docker0. This second instance
# binds to docker0's gateway address and forwards every query to the NM dnsmasq
# on 127.0.0.1, which already resolves *.ddev.site, *.fritz.box, llama.internal,
# and upstream queries.
#
# Containers on other Docker bridges (ddev's br-* networks) reach 172.17.0.1 via
# host routing, so a single listen-address covers all bridges.

port=53
bind-dynamic
listen-address=172.17.0.1

# Forward everything to the NM dnsmasq; do not read host resolv.conf or hosts.
no-resolv
no-hosts
server=127.0.0.1

pid-file=/run/dnsmasq-docker.pid

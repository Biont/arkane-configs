compress="zstd"
kernel_cmdline+=" splash quiet mitigations=off nowatchdog nmi_watchdog=0 "
add_drivers+=" i915 amdgpu xe "
add_dracutmodules+=" btrfs plymouth crypt tpm2-tss "
omit_dracutmodules+=" network iscsi  "

# Don't bake the build host's root/crypt parameters into the initramfs, update.sh
# rebuilds it on the running system, which would embed the previous deployment's rootflags
hostonly_cmdline="no"
